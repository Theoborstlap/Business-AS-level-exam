name: Mark exam submissions

# Runs whenever a submission changes, marks it with tools/marker.py (including
# OCR of handwritten photo answers), and commits the feedback back.
on:
  push:
    paths:
      - 'submissions/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ocr-${{ runner.os }}-v1

      - name: Cache EasyOCR models
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-models-v1

      - name: Install OCR dependencies (for handwritten photo answers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libgl1 libglib2.0-0
          python -m pip install --upgrade pip
          python -m pip install Pillow pillow-heif pytesseract
          python -m pip install easyocr || echo "easyocr optional install failed; Tesseract will be used"

      - name: Mark all submissions
        run: python3 tools/marker.py

      - name: Commit feedback (if any changed)
        run: |
          git config user.name "exam-marker-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add submissions/*.feedback.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No feedback changes to commit."
          else
            git commit -m "Auto-mark submissions [skip ci]"
            git push
          fi
